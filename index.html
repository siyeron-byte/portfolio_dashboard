<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Services Portfolio</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #171717;
            font-family: Arial, sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            padding: 15px;
            text-align: center;
            background: #222;
        }

        .viewer {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            min-height: 0;
        }

        img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            user-select: none;
            -webkit-user-drag: none;
        }

        footer {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            padding: 15px;
            background: #222;
        }

        button {
            padding: 10px 22px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        button:disabled {
            opacity: 0.4;
            cursor: default;
        }
    </style>
</head>

<body>

<header>
    <h3>Professional Services Portfolio</h3>
</header>

<div class="viewer">
    <img id="slide" src="slides/Slide1.JPG"
         alt="Presentation slide"
         draggable="false">
</div>

<footer>
    <button id="previous" onclick="changeSlide(-1)">
        Previous
    </button>

    <span id="counter">1 / 6</span>

    <button id="next" onclick="changeSlide(1)">
        Next
    </button>
</footer>

<script>

    const totalSlides = 6;
    let currentSlide = 1;

    function changeSlide(direction) {

        currentSlide += direction;

        if (currentSlide < 1) currentSlide = 1;

        if (currentSlide > totalSlides) {
            currentSlide = totalSlides;
        }

        document.getElementById("slide").src =
            "slides/Slide" + currentSlide + ".JPG";

        document.getElementById("counter").textContent =
            currentSlide + " / " + totalSlides;

        document.getElementById("previous").disabled =
            currentSlide === 1;

        document.getElementById("next").disabled =
            currentSlide === totalSlides;
    }

    document.addEventListener("keydown", function(event) {
        if (event.key === "ArrowRight") changeSlide(1);
        if (event.key === "ArrowLeft") changeSlide(-1);
    });

</script>

</body>
</html>
