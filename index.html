<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Professional Services Portfolio</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            background: #171717;
            font-family: Arial, sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            padding: 15px;
            text-align: center;
            background: #222;
        }

        .viewer {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            min-height: 0;
        }

        #slide {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            user-select: none;
            -webkit-user-drag: none;
        }

        footer {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 25px;
            padding: 15px;
            background: #222;
        }

        button {
            padding: 10px 22px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        button:disabled {
            opacity: 0.4;
            cursor: default;
        }

        html:fullscreen body {
            height: 100vh;
        }
    </style>
</head>

<body>

    <header>
        <h3>Professional Services Portfolio</h3>
    </header>

    <div class="viewer">
        <img id="slide"
             src="slides/Slide1.JPG"
             alt="Presentation slide 1"
             draggable="false">
    </div>

    <footer>
        <button id="previous" type="button" disabled>Previous</button>
        <span id="counter">1 / 7</span>
        <button id="next" type="button">Next</button>
        <button id="fullscreenBtn" type="button">Full Screen</button>
    </footer>

    <script>
        // Keep each filename exactly as it appears in the slides folder.
        // Uppercase and lowercase extensions are both supported.
        const slideFiles = [
            "Slide1.JPG",
            "Slide2.JPG",
            "Slide3.JPG",
            "Slide4.JPG",
            "Slide5.JPG",
            "Slide6.JPG",
            "Slide7.jpg"
        ];

        let currentSlideIndex = 0;

        const slideImage = document.getElementById("slide");
        const counter = document.getElementById("counter");
        const previousButton = document.getElementById("previous");
        const nextButton = document.getElementById("next");
        const fullscreenButton = document.getElementById("fullscreenBtn");

        function showSlide() {
            const fileName = slideFiles[currentSlideIndex];

            slideImage.src = "slides/" + fileName;
            slideImage.alt = "Presentation slide " + (currentSlideIndex + 1);

            counter.textContent =
                (currentSlideIndex + 1) + " / " + slideFiles.length;

            previousButton.disabled = currentSlideIndex === 0;
            nextButton.disabled = currentSlideIndex === slideFiles.length - 1;
        }

        function changeSlide(direction) {
            const newIndex = currentSlideIndex + direction;

            if (newIndex < 0 || newIndex >= slideFiles.length) {
                return;
            }

            currentSlideIndex = newIndex;
            showSlide();
        }

        async function toggleFullscreen() {
            try {
                if (!document.fullscreenElement) {
                    if (!document.documentElement.requestFullscreen) {
                        alert("Full-screen mode is not supported by this browser.");
                        return;
                    }

                    await document.documentElement.requestFullscreen();
                } else {
                    await document.exitFullscreen();
                }
            } catch (error) {
                console.error("Fullscreen toggle failed:", error);
                alert("Unable to change full-screen mode. Check your browser permissions or try opening the page directly in a browser tab.");
            }
        }

        previousButton.addEventListener("click", function () {
            changeSlide(-1);
        });

        nextButton.addEventListener("click", function () {
            changeSlide(1);
        });

        fullscreenButton.addEventListener("click", toggleFullscreen);

        document.addEventListener("fullscreenchange", function () {
            fullscreenButton.textContent = document.fullscreenElement
                ? "Exit Full Screen"
                : "Full Screen";
        });

        document.addEventListener("keydown", function (event) {
            // Do not hijack keys while the browser or another control is using them.
            if (event.altKey || event.ctrlKey || event.metaKey) {
                return;
            }

            if (event.key === "ArrowRight") {
                event.preventDefault();
                changeSlide(1);
            } else if (event.key === "ArrowLeft") {
                event.preventDefault();
                changeSlide(-1);
            } else if (event.key.toLowerCase() === "f" && !event.repeat) {
                event.preventDefault();
                toggleFullscreen();
            }
        });

        // Initialize the first slide and navigation state.
        showSlide();
    </script>

</body>
</html>
